<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><style>
.bg{fill:var(--bg,#0b0a08)}.bg2{fill:var(--bg-2,#12100c)}
.ln{fill:none;stroke:var(--line,#3b3325)}
.a{fill:var(--accent,#f5a83c)}.as{fill:none;stroke:var(--accent,#f5a83c)}.ao{stroke:var(--accent,#f5a83c)}
.d{fill:var(--accent-dim,#8a6226)}.ds{fill:none;stroke:var(--accent-dim,#8a6226)}
.f{fill:var(--fg,#e8dfcc)}.fs{fill:none;stroke:var(--fg,#e8dfcc)}
.k{fill:var(--accent-ink,#120d05)}.fa{fill:var(--faint,#64594a)}
.r{stroke-linecap:round;stroke-linejoin:round}
.scan{fill:url(#scan);pointer-events:none}
</style><defs>
<filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="2.2" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" style="fill:var(--scanline,rgba(0,0,0,.18))"/></pattern>
<clipPath id="tileclip"><rect width="128" height="128" rx="24"/></clipPath>
</defs><rect class="bg" width="128" height="128" rx="24"/><g filter="url(#glow)"><g transform="rotate(-10 48 38)"><ellipse class="bg ao" stroke-width="4" cx="48" cy="38" rx="10" ry="26"/><ellipse class="d" cx="48" cy="41" rx="4" ry="16"/></g><g transform="rotate(10 80 38)"><ellipse class="bg ao" stroke-width="4" cx="80" cy="38" rx="10" ry="26"/><ellipse class="d" cx="80" cy="41" rx="4" ry="16"/></g><ellipse class="bg ao" stroke-width="4" cx="64" cy="80" rx="32" ry="28"/><path class="fs r" stroke-width="5" d="M27 82C27 36 101 36 101 82"/><rect class="a" x="21" y="70" width="13" height="25" rx="6.5"/><rect class="a" x="94" y="70" width="13" height="25" rx="6.5"/><path class="as r" stroke-width="3.2" d="M48 80q5-5 10 0M70 80q5-5 10 0"/><circle class="d" cx="45" cy="90" r="4"/><circle class="d" cx="83" cy="90" r="4"/><path class="a" d="M60.5 87h7l-3.5 4z"/><path class="as r" stroke-width="2" d="M64 91v2.5q-3 3.5-6 1M64 93.5q3 3.5 6 1"/><path class="as r" stroke-width="3" d="M106 20v16M106 20q6 2 8 8"/><ellipse class="a" cx="102.5" cy="37" rx="4.5" ry="3.5" transform="rotate(-20 102.5 37)"/></g><rect class="ln" x="7.5" y="7.5" width="113" height="113" rx="17" stroke-width="1.5"/><rect class="scan" width="128" height="128" rx="24"/></svg>