[package]
name = "melodi-server"
version = "0.6.0"
description = "Melodi's web server: the desktop app's backend over HTTP, for the web app / PWA"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[dependencies]
melodi-core = { path = "../melodi-core" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip", "compression-br"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
strip = true
