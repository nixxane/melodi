[package]
name = "melodi-core"
version = "0.6.0"
description = "Melodi's YouTube Music backend: InnerTube, yt-dlp, lyrics, audio relay + cache"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "charset", "http2", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "sync", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"
thiserror = "1"
