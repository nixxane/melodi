name: Release

# Push a tag like v0.2.0 to build installers and publish a GitHub Release.
# The Release's latest.json is what the in-app updater checks.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # Older Ubuntu = older glibc, so the AppImage runs on more distros.
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Melodi ${{ github.ref_name }}"
          releaseBody: |
            **Windows:** download `Melodi_*_x64-setup.exe` and run it.
            Windows may show "Windows protected your PC" because the installer isn't code-signed — click **More info → Run anyway**.

            **Linux:** download the `.AppImage`, make it executable (`chmod +x Melodi_*.AppImage`) and run it — or install the `.deb` on Debian/Ubuntu.

            Already installed? Melodi will offer this update in the app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
