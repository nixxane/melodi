name: Server image

# Builds melodi-server and publishes ghcr.io/<owner>/melodi-server:latest
# whenever the backend changes on main. The VPS pulls it (deploy/README.md).
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "deploy/server.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/melodi-server -> target
      - name: Test core + server
        run: |
          cargo test --manifest-path crates/melodi-core/Cargo.toml
          cargo test --manifest-path crates/melodi-server/Cargo.toml --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          # Hetzner's x86 servers (CX/CPX/CCX). For an ARM server (CAX), use
          # linux/arm64 here instead (slower to build).
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/melodi-server:latest
            ghcr.io/${{ github.repository_owner }}/melodi-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
